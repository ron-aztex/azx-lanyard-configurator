<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AZX Lanyard Configurator</title>
  <meta name="description" content="Design your custom lanyard and see a live preview.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>AZX Lanyard Configurator</h1>
    <span id="progress"></span>
  </header>

  <main class="layout">
    <!-- Left: live preview -->
    <fieldset class="preview">
      <legend>Preview</legend>
      <p class="controls">
        View:
        <label><input type="radio" name="view" value="flat" checked> Flat lay</label>
        <label><input type="radio" name="view" value="worn" disabled> Worn (coming soon)</label>
        &nbsp;|&nbsp; Side:
        <label><input type="radio" name="side" value="front" checked> Front</label>
        <label><input type="radio" name="side" value="back"> Back</label>
      </p>
      <div id="preview-canvas" class="preview-canvas"></div>
      <p class="controls">
        Zoom:
        <button type="button" id="zoom-out">−</button>
        <button type="button" id="zoom-reset"><span id="zoom-level">100%</span></button>
        <button type="button" id="zoom-in">+</button>
      </p>
      <p id="preview-caption"></p>
      <p><small>Illustration only. Colours are matched to Pantone on your proof.</small></p>
    </fieldset>

    <!-- Right: option steps (only Material is built so far) -->
    <section class="builder" aria-label="Lanyard options">
      <div id="steps"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
